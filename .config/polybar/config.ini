[colors]
background = #282828
background-alt = #3c3836
separator = #928374
text = #83a598
text-alt = #b8bb26

[bar/top]
monitor = ${env:MONITOR:}
width = 100%
height = 24pt
radius = 0

dpi = 115

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt

border-size = 0pt
border-color = #00000000

module-margin = 1

separator = |
separator-foreground = ${colors.separator}

font-0 = Iosevka Nerd Font:size=16;6

modules-left = xworkspaces 
modules-center = xwindow
modules-right = wlan systray

cursor-click = pointer
cursor-scroll = ns-resize

[bar/bottom]
monitor = ${env:MONITOR:}
width = 100%
height = 24pt
dpi = 115
bottom = true
background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt

border-size = 0pt
border-color = #00000000

module-margin = 1
padding-left = 1
padding-right = 1

separator = |
separator-foreground = ${colors.separator}

font-0 = Iosevka Nerd Font:size=16;6

modules-left = filesystem pulseaudio battery power_profile
modules-center = music
modules-right = date 

[module/music]
type = custom/script
exec = ~/.config/polybar/now_playing.sh
interval = 5

[module/power_profile]
type = custom/script
exec = ~/.config/polybar/power_profile.sh
interval = 5

[module/systray]
type = internal/tray
format-margin = 8pt
tray-spacing = 16pt

[module/xworkspaces]
type = internal/xworkspaces

label-active = %name%
label-active-background = ${colors.background-alt}
label-active-underline= ${colors.primary}
label-active-padding = 1

label-occupied = %name%
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:100:...%

[module/filesystem]
type = internal/fs
interval = 25

mount-0 = /

label-mounted = %{F#F0C674}%mountpoint%%{F-} %percentage_used%%

label-unmounted = %mountpoint% not mounted
label-unmounted-foreground = ${colors.disabled}

[module/pulseaudio]
type = internal/pulseaudio

format-volume-prefix = ""
format-volume-prefix-foreground = ${colors.text-alt}

format-volume = <label-volume>

label-volume = %percentage%%

label-muted = muted
label-muted-foreground = ${colors.disabled}

[module/battery]
type = internal/battery
full-at = 99
low-at = 20
battery = BAT0
adapter = ADP1
poll-interval = 5

label-charging = 󰂄 %percentage%%
label-discharging = 󱧥 %percentage%%
label-full = 󱟢 %percentage%%
label-low = 󰂃 %percentage%%

[module/memory]
type = internal/memory
interval = 2
format-prefix = "RAM "
format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "CPU "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-disconnected = %{F#F0C674}%ifname%%{F#707880} disconnected

[module/wlan]
inherit = network-base
interface-type = wireless
label-connected = 󰖩  %essid%

[module/eth]
inherit = network-base
interface-type = wired
label-connected = %{F#F0C674}%ifname%%{F-} %local_ip%

[module/date]
type = internal/date
interval = 1

date = %m/%d/%Y %I:%M %p

label = %date%
label-foreground = ${colors.primary}

[settings]
screenchange-reload = true
pseudo-transparency = true

; vim:ft=dosini
